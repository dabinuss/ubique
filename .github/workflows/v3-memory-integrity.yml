name: Ubique V3 Memory Integrity

on:
  workflow_dispatch:
  # Read-only independent checks of the accumulated memory and cognitive focus.
  schedule:
    - cron: "37 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/v3-memory-integrity.yml"
      - "src/ubique/v3/**"
      - "tests/test_v3*.py"
      - "memory/v3/manifest.json"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Verify historical event continuity and lossless compression
        run: |
          python - <<'PY'
          from pathlib import Path
          from ubique.state import ROOT
          from ubique.v3.storage import Journal, read_json
          from ubique.v3.migration import bootstrap
          root = ROOT / "memory" / "v3"
          previous = read_json(root / "manifest.json", {})
          before = previous.get("events", 0)
          monthly = list((root / "events").glob("????-??.jsonl"))
          print("Before:", before, "monolithic files:", len(monthly))
          journal = Journal(root)
          events = journal.events(verify=True)
          assert len(events) == before, ("Event count changed", len(events), before)
          if monthly:
              assert not list((root / "events").glob("????-??.jsonl"))
              assert list((root / "events").glob("*.jsonl.gz"))
          graph, report = bootstrap(journal)
          assert journal.load_snapshot() is not None
          assert journal.snapshot_path.is_file()
          assert len(graph.nodes) > 100 and len(graph.edges) > 100
          assert int(journal.manifest["events"]) == before
          assert all(journal.verify_migration().values())
          print("Verified events:", len(events))
          print("Reconstructed nodes:", len(graph.nodes))
          print("Reconstructed synapses:", len(graph.edges))
          print("Compressed event files:", len(list((root / "events").glob("*.jsonl.gz"))))
          print("Snapshot size:", journal.snapshot_path.stat().st_size)
          print("All checks passed; workflow does not push or change persistent repository state.")
          PY
      - name: Verify live v3 cognition and indexed snapshot replay
        run: |
          python - <<'PY'
          from ubique.state import ROOT
          from ubique.config import Config
          from ubique.v3.storage import Journal
          from ubique.v3.runtime import UbiqueV3
          from ubique.v3.evidence import assess, is_system_topic
          from ubique.v3.text_quality import content_terms, META_TERMS

          journal = Journal(ROOT / "memory" / "v3")
          before = int(journal.manifest["events"])
          index = journal.manifest["segment_counts"]
          assert sum(item["events"] for item in index.values()) == before
          tail = journal.events(after=int(journal.manifest["snapshot_events"]))
          assert journal._cached_events is None
          assert len(tail) == before - journal.manifest["snapshot_events"]
          brain = UbiqueV3(Config.from_env(), enable_remote=False)
          assert len(brain.cortex.nodes) > 2000
          assert len(brain.cortex.edges) > 1200
          focus, recall = brain._recent_focus(int(brain.cortex.tick) + 1)
          items = brain.workspace.focus_labels()
          episodes = brain.hippocampus.all_episodes()
          sources = [ep for ep in episodes if ep.get("epistemic_status") == "source_passage"]
          assert sources and brain.world.claims
          assert any(not is_system_topic(s) for s in items), items
          # A real book-grounded workspace should not return to legacy CI chatter.
          recent_books = [ep for ep in reversed(episodes)
                          if ep.get("epistemic_status") == "source_passage"
                          and str(ep.get("source", "")).startswith("library:")][:4]
          grounding = set()
          for ep in recent_books:
              grounding.update(content_terms(str(ep.get("text", ""))[:3500], 60))
              grounding.update(content_terms(str(ep.get("payload", {}).get("title", "")), 12))
          supported = sum(1 for n in brain.cortex.nodes.values()
                          if n.activation >= .03 and n.label.casefold() in grounding)
          selected = sum(1 for title in items if title.casefold() in grounding)
          if supported >= 5:
              assert selected >= 5, (items, supported, selected)
          elif supported >= 2:
              assert selected >= 2, (items, supported, selected)
          assert not (set(label.casefold() for label in items) & META_TERMS), items
          print("Source-grounded workspace:", selected, "of", len(items))
          unrelated = assess("Unicorns are constructed from strawberry plastic", sources[:1])
          assert unrelated.verdict == "unrelated"
          print("Indexed events:", before)
          print("Snapshot replay delta:", len(tail))
          print("Synapses:", len(brain.cortex.edges))
          print("Books/source episodes:", len(sources))
          print("Top workspace:", items)
          print("Current curiosity focus:", focus)
          print("Current recorded stances:", len(brain.world.stances))
          print("Live corpus v3 smoke passed; nothing pushed.")
          PY
