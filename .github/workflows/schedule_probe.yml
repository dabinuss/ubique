name: Schedule Probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record scheduler wake
        run: |
          echo "schedule probe fired"
          echo "event=${{ github.event_name }}"
          date -u
