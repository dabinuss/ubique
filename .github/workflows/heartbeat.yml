name: Ubique Heartbeat

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, labeled, edited, closed, unlabeled, reopened]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ubique-autonomous-heartbeat
  cancel-in-progress: false

jobs:
  run-agent:
    if: >
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'ubique') ||
      github.event.action == 'closed' ||
      github.event.action == 'reopened' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'ubique')

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          UBIQUE_GEMINI_DAILY_LIMIT: ${{ vars.UBIQUE_GEMINI_DAILY_LIMIT || '20' }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          UBIQUE_GROQ_DAILY_LIMIT: ${{ vars.UBIQUE_GROQ_DAILY_LIMIT || '1000' }}

          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL || 'Qwen/Qwen2.5-7B-Instruct' }}
          HF_ENDPOINT: ${{ vars.HF_ENDPOINT || 'https://router.huggingface.co/hf-inference/models' }}

          UBIQUE_MAX_TASKS: ${{ vars.UBIQUE_MAX_TASKS || '3' }}
          UBIQUE_MEMORY_LIMIT: ${{ vars.UBIQUE_MEMORY_LIMIT || '500' }}
          UBIQUE_LOG_LEVEL: ${{ vars.UBIQUE_LOG_LEVEL || 'INFO' }}
        run: python -m ubique

      - name: Persist autonomous state
        if: always()
        run: |
          git config user.name "ubique-agent[bot]"
          git config user.email "ubique-agent[bot]@users.noreply.github.com"

          git add state memory

          if git diff --cached --quiet; then
            echo "No persistent state changes."
            exit 0
          fi

          git commit -m "agent: persist autonomous cycle [skip ci]"

          # main may advance while the agent is running (for example from a
          # human/code maintenance commit). Rebase the state commit onto the
          # latest main before pushing so a harmless concurrent commit does
          # not kill the heartbeat.
          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Could not safely rebase autonomous state onto current main."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; retrying ($attempt/3)."
            sleep $((attempt * 2))
          done

          echo "Could not persist autonomous state after 3 retries."
          exit 1


      - name: Continue autonomous pulse
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          SHOULD_CONTINUE="$(python -c 'import json; print(str(bool(json.load(open("state/pulse.json")).get("should_continue"))).lower())')"
          if [ "$SHOULD_CONTINUE" = "true" ]; then
            DELAY="$(python -c 'import json; print(max(20, min(int(json.load(open("state/pulse.json")).get("minimum_delay_seconds", 30)), 300)))')"
            echo "Active cognitive work remains; scheduling another pulse after ${DELAY}s."
          else
            # GitHub's cron is best effort and has sometimes arrived hours late.
            # Keep a second, independent continuation path for quiet periods.
            # Stay comfortably below the job's 20 minute timeout.
            DELAY=780
            echo "Quiet pulse; scheduling the next heartbeat after ${DELAY}s."
          fi
          sleep "$DELAY"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/heartbeat.yml/dispatches" \
            --data '{"ref":"main"}'
