name: Ubique Heartbeat

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ubique-autonomous-heartbeat
  cancel-in-progress: false

jobs:
  run-agent:
    if: >
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'ubique')

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          UBIQUE_GEMINI_DAILY_LIMIT: ${{ vars.UBIQUE_GEMINI_DAILY_LIMIT || '20' }}

          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL || 'Qwen/Qwen2.5-7B-Instruct' }}
          HF_ENDPOINT: ${{ vars.HF_ENDPOINT || 'https://router.huggingface.co/hf-inference/models' }}

          UBIQUE_MAX_TASKS: ${{ vars.UBIQUE_MAX_TASKS || '3' }}
          UBIQUE_MEMORY_LIMIT: ${{ vars.UBIQUE_MEMORY_LIMIT || '500' }}
          UBIQUE_LOG_LEVEL: ${{ vars.UBIQUE_LOG_LEVEL || 'INFO' }}
        run: python -m ubique

      - name: Persist autonomous state
        if: always()
        run: |
          git config user.name "ubique-agent[bot]"
          git config user.email "ubique-agent[bot]@users.noreply.github.com"

          git add state memory

          if git diff --cached --quiet; then
            echo "No persistent state changes."
            exit 0
          fi

          git commit -m "agent: persist autonomous cycle [skip ci]"
          git push origin HEAD:main
