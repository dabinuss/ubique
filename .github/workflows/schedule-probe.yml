name: Schedule Probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm scheduled wake
        run: |
          echo "schedule probe fired"
          echo "event=$GITHUB_EVENT_NAME"
          date -u
